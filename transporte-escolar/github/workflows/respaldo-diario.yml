name: Respaldo diario de Supabase

on:
  schedule:
    # Todos los días a las 08:00 UTC (2:00 AM hora Monterrey)
    - cron: "0 8 * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Descargar todas las tablas de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p respaldos
          FECHA=$(date -u +"%Y-%m-%d")
          ARCHIVO="respaldos/respaldo-${FECHA}.json"

          TABLAS=(drivers trucks accounts payments expenses periodos_inactivos configuracion)

          echo "{" > "$ARCHIVO"
          PRIMERA=true
          for TABLA in "${TABLAS[@]}"; do
            if [ "$PRIMERA" = false ]; then echo "," >> "$ARCHIVO"; fi
            PRIMERA=false
            echo -n "\"$TABLA\": " >> "$ARCHIVO"
            curl -s "$SUPABASE_URL/rest/v1/$TABLA?select=*" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              >> "$ARCHIVO"
          done
          echo "}" >> "$ARCHIVO"

          # Validar que sea JSON valido antes de darlo por bueno
          python3 -m json.tool "$ARCHIVO" > /dev/null

      - name: Guardar el respaldo en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add respaldos/
          git diff --staged --quiet || git commit -m "Respaldo automático $(date -u +'%Y-%m-%d')"
          git push
